name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          # install-qt-action v4 exposes QT_ROOT_DIR (not Qt6_DIR)
          $qt = $env:QT_ROOT_DIR
          if (-not $qt) { throw "QT_ROOT_DIR is empty" }
          Write-Host "Qt root: $qt"

          # Detect installed Visual Studio generator (2022 or 2026)
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $inst = & $vswhere -latest -products '*' -property installationVersion
          if ($inst -like '18.*') { $gen = 'Visual Studio 18 2026' }
          elseif ($inst -like '17.*') { $gen = 'Visual Studio 17 2022' }
          else { throw "Unsupported Visual Studio version: $inst" }
          Write-Host "Using generator: $gen"

          cmake -S . -B build -G $gen -A x64 "-DCMAKE_PREFIX_PATH=$qt"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $exe = "build\Release\PeriodicTable.exe"
          if (-not (Test-Path $exe)) { throw "Executable not found" }
          $wq = Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe"
          if (-not (Test-Path $wq)) { throw "windeployqt not found at $wq" }
          & $wq --release --no-translations --no-system-d3d-compiler `
              --no-opengl-sw $exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }

      - name: Package
        shell: pwsh
        run: |
          $name = "PeriodicTable-${{ github.ref_name }}-win64"
          New-Item -ItemType Directory -Force -Path "dist\$name" | Out-Null
          Copy-Item "build\Release\*" "dist\$name\" -Recurse -Force
          Compress-Archive -Path "dist\$name\*" -DestinationPath "dist\$name.zip" -Force
          Write-Host "Packaged: dist\$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error

  build-linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev libgl1-mesa-dev \
              fonts-noto-cjk python3-fonttools zlib1g-dev fakeroot

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Assemble self-contained package
        run: |
          set -e
          NAME="PeriodicTable-${{ github.ref_name }}-linux-x64"
          PKG="dist/$NAME"
          mkdir -p "$PKG/lib/plugins/platforms" "$PKG/fonts"

          cp build/PeriodicTable "$PKG/"
          cp resources/PeriodicTable.png "$PKG/periodic-table.png"

          # Recursively collect runtime dependencies (excluding glibc/gcc core)
          collect() {
            local target="$1"
            ldd "$target" 2>/dev/null | awk '/=> \// {print $3}' | while read -r lib; do
              [ -f "$lib" ] || continue
              b=$(basename "$lib")
              case "$b" in
                libc.so.6|libm.so.6|libpthread.so.0|libdl.so.2|librt.so.1|libstdc++.so.6|libgcc_s.so.1|ld-linux*) continue ;;
              esac
              if [ ! -e "$PKG/lib/$b" ]; then
                cp -L "$lib" "$PKG/lib/$b"
                collect "$PKG/lib/$b"
              fi
            done
          }
          collect build/PeriodicTable

          PLUGDIR=$(find /usr/lib -type d -path '*qt6/plugins/platforms' | head -1)
          for plug in libqxcb.so libqoffscreen.so libqminimal.so; do
            [ -f "$PLUGDIR/$plug" ] && cp "$PLUGDIR/$plug" "$PKG/lib/plugins/platforms/"
          done
          for plug in "$PKG"/lib/plugins/platforms/*.so; do
            [ -f "$plug" ] && collect "$plug"
          done

          # CJK font subset (all 118 element names incl. extension chars)
          python3 - <<'PY'
          import glob
          chars=set(chr(i) for i in range(0x20,0x7f))
          for c in "，。、；：？！“”‘’（）《》〈〉【】·—…￥％＃＆＠～²³¹⁰⁻×℃":
              chars.add(c)
          for p in glob.glob('*.cpp')+glob.glob('*.h'):
              chars.update(ch for ch in open(p,encoding='utf-8').read() if ord(ch)>127)
          open('/tmp/charset.txt','w',encoding='utf-8').write(''.join(sorted(chars)))
          PY
          for w in Regular Bold; do
            python3 -m fontTools.subset "/usr/share/fonts/opentype/noto/NotoSansCJK-${w}.ttc" \
              --font-number=2 --text-file=/tmp/charset.txt \
              --output-file="$PKG/fonts/NotoSansSC-${w}.otf" \
              --layout-features='*' --no-hinting --desubroutinize --name-IDs='*'
          done

          cp linux/run-selfcontained.sh "$PKG/run.sh"
          cp linux/run.sh "$PKG/run-local.sh"
          cp linux/install.sh linux/uninstall.sh "$PKG/"
          cp linux/periodic-table.desktop "$PKG/"
          cp linux/README.md "$PKG/README.md"
          chmod +x "$PKG/PeriodicTable" "$PKG"/*.sh

          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          echo "Packaged: dist/$NAME.tar.gz"

      - name: Build .deb package
        shell: bash
        run: |
          set -e
          bash scripts/build-deb.sh "${GITHUB_REF_NAME#v}" "$PWD"
          ls -lh dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and checksum
        run: |
          set -e
          mkdir -p out
          find artifacts -type f \( -name '*.zip' -o -name '*.7z' -o -name '*.tar.gz' -o -name '*.deb' \) -exec cp {} out/ \;
          cd out
          sha256sum * > SHA256SUMS.txt
          echo "=== Release artifacts ==="
          ls -lh
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            ## 元素周期表 Pro ${{ github.ref_name }}

            专业完整的交互式元素周期表，C++17 + Qt6，Windows / Linux 双平台。

            ### 下载
            | 平台 | 文件 | 说明 |
            |------|------|------|
            | Windows x64 | `PeriodicTable-${{ github.ref_name }}-win64.zip` | 解压即用，含 Qt 运行库 |
            | Linux (APT 推荐) | `periodictable-pro_<版本>_amd64.deb` | `sudo apt install ./periodictable-pro_*_amd64.deb` |
            | Linux (免安装) | `PeriodicTable-${{ github.ref_name }}-linux-x64.tar.gz` | `tar -xzf` 后 `./run.sh` |

            校验值见 `SHA256SUMS.txt`（包含全部文件的 SHA256）。
